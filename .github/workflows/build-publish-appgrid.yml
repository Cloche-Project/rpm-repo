name: Build and Publish AppGrid RPM

on:
  schedule:
    - cron: '0 9 * * *'
  workflow_dispatch:
    inputs:
      version:
        description: 'Exact version to build (e.g. 1.9.3). Leave empty to auto-detect.'
        required: false
        default: ''
      force:
        description: 'Build even if version matches stored'
        type: boolean
        default: false

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  check-version:
    runs-on: ubuntu-latest
    outputs:
      version:      ${{ steps.resolve.outputs.version }}
      libplasma:    ${{ steps.resolve.outputs.libplasma }}
      should_build: ${{ steps.resolve.outputs.should_build }}

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Resolve version and compare with stored
        id: resolve
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [ -n "${{ inputs.version }}" ]; then
            VERSION="${{ inputs.version }}"
          else
            VERSION=$(curl -sf \
              -H "Authorization: Bearer $GH_TOKEN" \
              https://api.github.com/repos/xarbit/plasma6-applet-appgrid/releases/latest \
              | jq -r '.tag_name' | sed 's/^v//')
            if [ -z "$VERSION" ]; then
              echo "Failed to fetch upstream version" >&2
              exit 1
            fi
          fi

          # AppGrid is a compiled Plasma plugin linked against libPlasma's
          # soname, so a Fedora Plasma bump (e.g. 6.7 -> 6.8 dropped
          # libPlasma.so.7) leaves the published RPM uninstallable even with
          # no upstream AppGrid release. Track the libplasma it was built
          # against and rebuild when Fedora's changes.
          LIBPLASMA=$(docker run --rm fedora:44 \
            dnf repoquery -q --latest-limit 1 --arch x86_64 --qf '%{version}\n' libplasma \
            | tail -n1)
          if [ -z "$LIBPLASMA" ]; then
            echo "Failed to query Fedora 44 libplasma version" >&2
            exit 1
          fi

          STORED=$(cat versions/appgrid 2>/dev/null || echo "")
          STORED_LP=$(cat versions/appgrid-libplasma 2>/dev/null || echo "")
          echo "Upstream: $VERSION  |  Stored: ${STORED:-<none>}"
          echo "libplasma (F44): $LIBPLASMA  |  Stored: ${STORED_LP:-<none>}"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "libplasma=$LIBPLASMA" >> "$GITHUB_OUTPUT"

          if [ "$VERSION" != "$STORED" ] || [ "$LIBPLASMA" != "$STORED_LP" ] \
             || [ "${{ inputs.force }}" = "true" ]; then
            echo "should_build=true" >> "$GITHUB_OUTPUT"
          else
            echo "should_build=false" >> "$GITHUB_OUTPUT"
            echo "Already at $VERSION, nothing to do"
          fi

  build:
    needs: check-version
    if: needs.check-version.outputs.should_build == 'true'

    strategy:
      fail-fast: false
      matrix:
        target:
          - name:     fedora-44
            image:    fedora:44
            setup:    ""
            optional: false
          - name:     centos-stream-10
            image:    quay.io/centos/centos:stream10
            setup:    "dnf install -y epel-release && dnf config-manager --set-enabled crb"
            optional: true # KF6 devel headers on EPEL 10 are newer/less battle-tested; don't block the Fedora build on this

    runs-on: ubuntu-latest
    container:
      image: ${{ matrix.target.image }}

    continue-on-error: ${{ matrix.target.optional }}

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Distro-specific repo setup
        if: matrix.target.setup != ''
        run: ${{ matrix.target.setup }}

      - name: Install RPM build toolchain
        run: |
          dnf install -y \
            rpm-build rpmdevtools rpm-sign gnupg2 curl jq

      # rpmbuild's --define "version X" does NOT override the spec's own
      # Version: tag (the tag redefines %version), so without this every
      # "new version" build silently rebuilt whatever the spec hardcoded.
      - name: Pin spec Version to the resolved upstream version
        run: |
          sed -i "s/^Version:.*/Version:        ${{ needs.check-version.outputs.version }}/" \
            specs/plasma-applet-appgrid.spec
          grep '^Version:' specs/plasma-applet-appgrid.spec

      - name: Install BuildRequires from spec
        run: dnf builddep -y specs/plasma-applet-appgrid.spec

      - name: Set up rpmbuild tree
        run: rpmdev-setuptree

      - name: Fetch source tarball
        run: |
          spectool -g -R specs/plasma-applet-appgrid.spec

      - name: Build binary RPM
        run: |
          rpmbuild -bb \
            --define "abi_tag lp${{ needs.check-version.outputs.libplasma }}" \
            --define "_smp_mflags -j$(nproc)" \
            specs/plasma-applet-appgrid.spec

      - name: Collect built RPMs
        run: |
          mkdir -p /tmp/rpms
          find ~/rpmbuild/RPMS -name '*.rpm' -exec cp {} /tmp/rpms/ \;

      - name: Upload RPM artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: rpms-${{ matrix.target.name }}
          path: /tmp/rpms/*.rpm
          if-no-files-found: error

  sign-and-publish:
    needs: [check-version, build]
    if: always() && needs.check-version.outputs.should_build == 'true'
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Download all RPM artifacts
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          path: /tmp/all-rpms
          pattern: rpms-*

      - name: Check if any RPMs were downloaded
        run: |
          COUNT=$(find /tmp/all-rpms -name '*.rpm' 2>/dev/null | wc -l)
          if [ "$COUNT" -eq 0 ]; then
            echo "No RPMs built successfully, nothing to publish"
            exit 1
          fi
          echo "$COUNT RPM(s) ready to sign and publish"

      - name: Install signing and repo tools
        run: |
          sudo apt-get update -q
          sudo apt-get install -y --no-install-recommends \
            gnupg rpm createrepo-c

      - name: Import GPG signing key
        env:
          GPG_PRIVATE_KEY: ${{ secrets.GPG_PRIVATE_KEY }}
          GPG_PASSPHRASE:  ${{ secrets.GPG_PASSPHRASE }}
        run: |
          echo "$GPG_PRIVATE_KEY" | base64 -d | gpg --batch --import
          cat > ~/.rpmmacros << 'EOF'
          %_signature      gpg
          %_gpg_name       Cloche Signing Key
          %_gpg_digest_algo sha256
          %_gpg_sign_cmd_extra_args --batch --pinentry-mode loopback --passphrase-fd 3
          EOF
          # Don't override %__gpg_sign_cmd: its old "%{__gpg} gpg ..." form
          # (second token = argv[0]) breaks on rpm >= 6 (ubuntu-latest is
          # 26.04 since 2026-10-19), which passes "gpg" through as an arg.

      - name: Sign all RPMs
        env:
          GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}
        run: |
          find /tmp/all-rpms -name '*.rpm' | while read RPM; do
            echo "Signing: $RPM"
            echo "$GPG_PASSPHRASE" | rpmsign --addsign \
              --define "_gpg_name Cloche Signing Key" \
              "$RPM" 3<&0
          done

      - name: Checkout gh-pages branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: gh-pages
          path: gh-pages

      - name: Organise RPMs into repo tree
        run: |
          declare -A TARGET_PATHS
          TARGET_PATHS["rpms-fedora-44"]="cloche/44/x86_64"
          TARGET_PATHS["rpms-centos-stream-10"]="cloche-pro/10/x86_64"

          for ARTIFACT_DIR in /tmp/all-rpms/*/; do
            ARTIFACT_NAME=$(basename "$ARTIFACT_DIR")
            REPO_PATH="${TARGET_PATHS[$ARTIFACT_NAME]:-}"
            [ -z "$REPO_PATH" ] && continue
            DEST="gh-pages/$REPO_PATH"
            mkdir -p "$DEST"
            find "$ARTIFACT_DIR" -name '*.rpm' -exec cp -f {} "$DEST/" \;
          done

      - name: Regenerate repodata
        run: |
          for REPO_DIR in gh-pages/cloche gh-pages/cloche-pro; do
            [ -d "$REPO_DIR" ] || continue
            find "$REPO_DIR" -mindepth 2 -maxdepth 2 -type d | while read ARCH_DIR; do
              createrepo_c --update --checksum sha256 "$ARCH_DIR"
            done
          done

      - name: Export public GPG key
        run: |
          gpg --armor --export "Cloche Signing Key" > gh-pages/RPM-GPG-KEY-cloche

      - name: Copy .repo files
        run: |
          cp cloche-rpm.repo gh-pages/cloche-rpm.repo
          cp cloche-pro-rpm.repo gh-pages/cloche-pro-rpm.repo

      - name: Commit and push gh-pages
        working-directory: gh-pages
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add .
          git diff --cached --quiet && echo "Nothing changed" && exit 0
          git commit -m "repo: publish appgrid ${{ needs.check-version.outputs.version }} (libplasma ${{ needs.check-version.outputs.libplasma }})"
          git push origin gh-pages

      - name: Bump version tracking file
        run: |
          echo "${{ needs.check-version.outputs.version }}" > versions/appgrid
          echo "${{ needs.check-version.outputs.libplasma }}" > versions/appgrid-libplasma
          sed -i "s/^Version:.*/Version:        ${{ needs.check-version.outputs.version }}/" \
            specs/plasma-applet-appgrid.spec
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add versions/appgrid versions/appgrid-libplasma specs/plasma-applet-appgrid.spec
          git commit -m "chore: track appgrid ${{ needs.check-version.outputs.version }} (libplasma ${{ needs.check-version.outputs.libplasma }})" || true
          git push origin main
